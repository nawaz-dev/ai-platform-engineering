apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fde-eventlistener-role
  namespace: ai-platform-ci
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - triggers
      - triggerbindings
      - triggertemplates
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fde-eventlistener-binding
  namespace: ai-platform-ci
subjects:
  - kind: ServiceAccount
    name: fde-eventlistener-sa
    namespace: ai-platform-ci
roleRef:
  kind: Role
  name: fde-eventlistener-role
  apiGroup: rbac.authorization.k8s.io