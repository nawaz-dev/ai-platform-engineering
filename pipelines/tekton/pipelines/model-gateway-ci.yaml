apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: model-gateway-ci
spec:
  params:
  - name: repo-url
    type: string
    default: https://github.com/nawaz-dev/ai-platform-engineering.git
  - name: revision
    type: string
    default: main
  - name: gitops-file
    type: string
    default: argocd/applications/model-gateway-dev.yaml
  - name: image
    type: string
    default: nawaz343/model-gateway:latest
  - name: image-repository
    type: string
    default: nawaz343/model-gateway
  workspaces:
  - name: source
  tasks:
  - name: clone
    taskRef:
      name: fde-git-clone
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    workspaces: &id001
    - name: source
      workspace: source
  - name: go-test-build
    taskRef:
      name: fde-go-test-build
    runAfter:
    - clone
    params:
    - name: app-path
      value: applications/model-gateway
    workspaces: *id001
  - name: scan-application
    taskRef:
      name: fde-security-scan
    runAfter:
    - go-test-build
    params:
    - name: scan-path
      value: applications/model-gateway
    workspaces:
    - name: source
      workspace: source
  - name: image-build-push
    runAfter:
      - go-test-build
    taskRef:
      kind: Task
      name: fde-image-build-push
    params:
      - name: IMAGE
        value: $(params.image-repository):$(tasks.clone.results.commit)
      - name: CONTEXT
        value: applications/model-gateway
      - name: DOCKERFILE
        value: applications/model-gateway/Dockerfile
    workspaces:
    - name: source
      workspace: source
  - name: gitops-promote
    runAfter:
      - image-build-push
    taskRef:
      name: gitops-promote
    params:
      - name: commit-sha
        value: $(tasks.clone.results.commit)

      - name: app-path
        value: applications/model-gateway

      - name: image-repository
        value: $(params.image-repository)

      - name: image-tag
        value: $(tasks.clone.results.commit)
  results:
  - name: validated-commit
    value: $(tasks.clone.results.commit)
