apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: application-ci-template
spec:
  params:
  - name: git-revision
    description: Git commit SHA
  - name: pipeline-name
  - name: gitops-file
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: application-ci-
    spec:
      pipelineRef:
        name: $(tt.params.pipeline-name)
      taskRunTemplate:
        serviceAccountName: fde-tekton-sa
      params:
      - name: repo-url
        value: https://github.com/nawaz-dev/ai-platform-engineering.git
      - name: revision
        value: $(tt.params.git-revision)
      - name: gitops-file
        value: $(tt.params.gitops-file)
      workspaces:
      - name: source
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
