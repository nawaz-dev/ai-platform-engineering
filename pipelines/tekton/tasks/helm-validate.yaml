apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fde-helm-validate
spec:
  params:
  - name: chart-path
    type: string
  - name: release-name
    type: string
  - name: namespace
    type: string
    default: llm-serving
  steps:
  - name: validate
    image: alpine/helm:3.17.3
    env:
    - name: CHART
      value: $(params.chart-path)
    - name: RELEASE
      value: $(params.release-name)
    - name: NAMESPACE
      value: $(params.namespace)
    workingDir: $(workspaces.source.path)/repo
    script: |
      #!/bin/sh
      set -eu

      helm lint "$CHART"
      helm template "$RELEASE" "$CHART" --namespace "$NAMESPACE" > /tmp/rendered.yaml
      test -s /tmp/rendered.yaml
  workspaces:
  - name: source
