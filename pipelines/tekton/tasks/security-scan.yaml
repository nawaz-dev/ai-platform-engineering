apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fde-security-scan
spec:
  params:
  - name: scan-path
    type: string
  - name: scanners
    type: string
    default: vuln,secret,misconfig
  steps:
  - name: trivy
    image: aquasec/trivy:0.58.2
    env:
      - name: HOME
        value: /tmp
      - name: TRIVY_CACHE_DIR
        value: /tmp/trivy-cache
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
    command:
    - trivy
    args:
    - fs
    - --scanners
    - $(params.scanners)
    - --severity
    - HIGH,CRITICAL
    - --exit-code
    - '1'
    - --no-progress
    - $(workspaces.source.path)/repo/$(params.scan-path)
  workspaces:
  - name: source
