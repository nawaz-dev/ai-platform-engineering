apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fde-go-test-build
spec:
  params:
  - name: app-path
    type: string
  - name: go-image
    type: string
    default: golang:1.26
  steps:
  - name: test-build
    image: $(params.go-image)
    workingDir: $(workspaces.source.path)/repo/$(params.app-path)
    env:
      - name: HOME
        value: /tmp
      - name: GOCACHE
        value: /tmp/go-build
      - name: GOPATH
        value: /tmp/go
      - name: GOMODCACHE
        value: /tmp/go/pkg/mod
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
    script: |
      #!/bin/sh
      set -eu

      go test ./...
      go build ./...
  workspaces:
  - name: source
