
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fde-image-build-push
  namespace: ai-platform-ci
spec:
  description: Build and push an OCI image using Buildah.

  params:
    - name: IMAGE
      type: string
      description: Full image destination including tag

    - name: CONTEXT
      type: string
      default: "."
      description: Build context relative to the cloned repository

    - name: DOCKERFILE
      type: string
      default: "./Dockerfile"
      description: Dockerfile relative to workspace

    - name: STORAGE_DRIVER
      type: string
      default: vfs

  workspaces:
    - name: source

  results:
    - name: IMAGE_DIGEST
      description: Digest of the pushed image

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.39
      workingDir: $(workspaces.source.path)/repo
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - name: HOME
          value: /tekton/home
        - name: XDG_CONFIG_HOME
          value: /tmp/.config
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: REGISTRY_AUTH_FILE
          value: /tekton/home/.docker/config.json
      script: |
        #!/bin/sh
        set -eu

        echo "Current directory:"
        pwd

        echo "Workspace contents:"
        ls -la "$(workspaces.source.path)"

        echo "Available directories:"
        find "$(workspaces.source.path)" -maxdepth 3 -type d

        echo "Checking application directory:"
        test -d "$(params.CONTEXT)" || {
          echo "ERROR: Application context not found"
          exit 1
        }

        if [ ! -r "$REGISTRY_AUTH_FILE" ] && [ -r /tekton/creds/.docker/config.json ]; then
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          cp /tekton/creds/.docker/config.json "$REGISTRY_AUTH_FILE"
        fi

        if [ ! -r "$REGISTRY_AUTH_FILE" ]; then
          echo "ERROR: Docker registry credentials were not initialized at $REGISTRY_AUTH_FILE"
          echo "Ensure dockerhub-credentials is annotated with tekton.dev/docker-0 and attached to fde-tekton-sa"
          exit 1
        fi

        buildah --storage-driver="$(params.STORAGE_DRIVER)" bud \
          --format oci \
          --file "$(params.DOCKERFILE)" \
          --tag "$(params.IMAGE)" \
          "$(params.CONTEXT)"

        buildah --storage-driver="$(params.STORAGE_DRIVER)" push \
          --digestfile "$(results.IMAGE_DIGEST.path)" \
          "$(params.IMAGE)" \
          "docker://$(params.IMAGE)"

        echo "Successfully pushed $(params.IMAGE)"
