
{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ tpl (default (printf "%s-models" .Release.Name) .Values.configMap.name) . }}
  labels:
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ .Values.configMap.key }}: |
    {
      "models": {{ .Values.models | toJson }}
    }
  {{- if .Values.configMap.env.enabled }}
  {{- range $key, $value := .Values.configMap.env.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
