apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: model-gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/models: {{ .Values.models | toJson | sha256sum | quote }}
        checksum/env: {{ .Values.configMap.env.values | toJson | sha256sum | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.containers }}
      {{- fail "containers must contain at least one container" }}
      {{- end }}
      containers:
        {{- range $container := .Values.containers }}
        {{- $containerFields := omit $container "env" }}
        {{- tpl (toYaml (list $containerFields)) $ | nindent 8 }}
          {{- if or (and $.Values.configMap.enabled $.Values.configMap.env.enabled) $container.env }}
          env:
            {{- if and $.Values.configMap.enabled $.Values.configMap.env.enabled }}
            {{- range $key, $_ := $.Values.configMap.env.values }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ tpl (default (printf "%s-models" $.Release.Name) $.Values.configMap.name) $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- with $container.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- end }}
      volumes:
        {{- tpl (toYaml .Values.volumes) . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
