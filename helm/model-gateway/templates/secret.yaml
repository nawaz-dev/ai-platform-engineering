{{- if .Values.secret.enabled }}
{{- $gatewayAPIKey := get .Values.secret.stringData .Values.secret.key | default "" }}
{{- if or (not $gatewayAPIKey) (eq $gatewayAPIKey "REPLACE_WITH_A_SECURE_GATEWAY_API_KEY") }}
{{- fail "set secret.stringData.GATEWAY_API_KEY to the real value when secret.enabled is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
type: {{ .Values.secret.type }}
{{- with .Values.secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
{{- end }}
