
replicaCount: 1

image:
  repository: quay.io/your-org/model-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

gateway:
  port: 5000
  redisAddr: redis:6379
  rateLimitRPM: 60
  existingSecret: model-gateway-secrets
  modelConfigMountPath: /app/configs/models.json

models:
  - model_id: qwen-small
    provider: vllm
    base_url: http://vllm.llm-serving.svc.cluster.local:8000
    provider_model_id: qwen-small

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
