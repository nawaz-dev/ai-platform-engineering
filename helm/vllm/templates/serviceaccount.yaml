{{/*
Purpose: Creates a Kubernetes identity for the inference pods when serviceAccount.create
is enabled. The Deployment uses this account, a configured existing account,
or the namespace default account; this file does not grant RBAC permissions.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vllm.serviceAccountName" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}