{{/*
Purpose: Optionally creates Kubernetes Secrets from secrets.secretsObjects.
Supports pre-encoded data or plain stringData for credentials consumed by pods.
Base64 encoding is not encryption; avoid committing real credentials.
*/}}
{{- if .Values.secrets.enabled -}}
{{- range $secret :=  .Values.secrets.secretsObjects }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.secretName }}
  labels:
    {{- include "vllm.labels" $ | nindent 4 }}
type: {{ $secret.type }}
{{- with $secret.data }}
data: 
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $secret.stringData }}
stringData: 
  {{- toYaml . | nindent 2 }}
{{- end }}

{{- end }}
{{- end }}
