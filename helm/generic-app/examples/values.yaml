#       secretName: rag-tls
#   # 6. Projected service account / config (only if needed)
#   - name: projected-settings
#     projected:
#       sources:
#         - configMap:
#             name: rag-config
#   # 7. Direct NFS mount (prefer a PV/PVC in most environments)
#   - name: nfs-share
#     nfs:
#       server: 192.168.1.50
#       path: /exports/ai-platform
#       readOnly: false

# Each container requires its own volumeMounts. This list is for the main container.
volumeMounts: []
# volumeMounts:
#   - name: common-data
#     mountPath: /app/shared
#     subPath: documents
#   - name: rag-uploads
#     mountPath: /app/uploads
