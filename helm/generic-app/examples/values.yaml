# Autoscaling needs metrics-server and appropriate CPU/memory requests.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics: []
  # customMetrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: http_requests_per_second
  #       target:
  #         type: AverageValue
  #         averageValue: "100"
  # Requires an installed custom metrics adapter for that metric.

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # Use one or the other, not both

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: rag.lab.example
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
  tls: []
  # tls:
  #   - secretName: rag-tls
  #     hosts: [rag.lab.example]

# Only supported with an OpenShift-specific Route template and CRD.
route:
  enabled: false
  host: rag.apps.example.com
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Optional NetworkPolicy; use an explicitly chosen baseline (default-deny vs allowlist).
# NetworkPolicies work only if your cluster CNI implements them.
networkPolicy:
  enabled: false
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
      ports:
        - protocol: TCP
          port: 6379
  # Add DNS egress (TCP/UDP 53), monitoring and cross-cluster inference as needed.

metrics:
  enabled: false
  port: 9090
  path: /metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9090"

# Requires Prometheus Operator ServiceMonitor CRD and appropriate Prometheus selector.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

logging:
  format: json
  level: info
tracing:
  enabled: false
  serviceName: model-gateway
  otlpEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  protocol: grpc
  samplingRatio: 0.1

# Separate job.yaml / cronjob.yaml templates needed.
jobs: []
# jobs:
#   - name: migrate
#     image: registry.example.local/ai/rag-api:1.0.0
#     command: ["/app/migrate"]
#     backoffLimit: 2
#     restartPolicy: Never
cronJobs: []
# cronJobs:
#   - name: cleanup
#     schedule: "0 2 * * *"
#     concurrencyPolicy: Forbid
#     successfulJobsHistoryLimit: 1
#     failedJobsHistoryLimit: 2
#     image: busybox:1.36
#     command: ["sh", "-c", "find /data/tmp -type f -mtime +7 -delete"]
#     volumeMounts:
#       - name: common-data
#         mountPath: /data

# Only for GPU workloads; GPU resource requests generally equal limits.
gpu:
  enabled: false
  resourceName: nvidia.com/gpu
  count: 1
# Prefer setting resource limits in GPU inference chart, not model-gateway.
