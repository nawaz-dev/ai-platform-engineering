#     storageClassName: nfs-client  # Only if this class actually exists
#     accessModes: [ReadWriteMany]
#     volumeMode: Filesystem
#     size: 20Gi
#     annotations: {}
#     labels: {}

# Each init container has its own image/securityContext/resources/volumeMounts.
initContainers: []
