# FDE GENERIC APPLICATION CHART — EXAMPLE VALUES
# Deploy each stateless application as a separate Helm release into ai-platform.
# IMPORTANT: This is a proposed chart interface. Corresponding Helm templates must
# implement these keys; placing them in values.yaml alone creates no resources.
# Uncomment examples or replace [] / {} as needed. Do not enable all features at once.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""  # Prefer Argo CD destination.namespace or --namespace

commonLabels:
  app.kubernetes.io/part-of: fde-ai-platform
  platform: fde-ai
commonAnnotations: {}
# commonAnnotations:
#   owner: fde-platform-team
#   documentation: "https://internal.example/docs"

replicaCount: 1
revisionHistoryLimit: 3

deploymentAnnotations: {}
# deploymentAnnotations:
#   reloader.stakater.com/auto: "true"  # Requires a separately installed reloader
podAnnotations: {}
# podAnnotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "9090"
podLabels: {}
# podLabels:
#   team: ai-engineering

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: registry.example.local/ai/model-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
# imagePullSecrets:
#   - name: internal-registry-credentials

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP
# - name: metrics
#   containerPort: 9090
#   protocol: TCP

command: []
# command: ["/app/server"]
args: []
# args: ["--listen", ":8080"]
workingDir: ""
# workingDir: /app

env:
  - name: PORT
    value: "8080"
  - name: LOG_LEVEL
    value: info
# - name: MODEL_BACKEND_URL
#   valueFrom:
#     secretKeyRef:
#       name: model-gateway-config
#       key: backend-url
# - name: INSTANCE_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.name

envFrom: []
# envFrom:
#   - configMapRef:
#       name: model-gateway-env
#   - secretRef:
#       name: model-gateway-secrets


configMaps: []
# configMaps:
