#       ENABLE_OCR: true
#       VECTOR_DB: qdrant

#   - name: application-settings
#     enabled: true
#     annotations:
#       description: "Application configuration"
#     data:
#       config.json: |
#         {
#           "logging": {
#             "level": "info"
#           },
#           "cache": {
#             "enabled": true,
#             "ttl": 3600
#           }
#         }

#   - name: binary-config
#     enabled: true
#     binaryData:
#       sample.bin: "SGVsbG8gRkRF"

#   - name: disabled-config
#     enabled: false
#     data:
#       DEBUG: true


# Create no plaintext Secrets from values.yaml; reference externally managed Secrets.
existingSecrets: []
# existingSecrets:
#   - model-gateway-secrets
#   - database-credentials

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 30
  timeoutSeconds: 2
readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 2
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 2
# For background workers that have no HTTP endpoint, disable the above probes
# and use a supported exec/tcpSocket probe instead.

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-internal: "true"  # AWS only
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # - name: metrics
  #   port: 9090
  #   targetPort: metrics

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # annotations:
  #   example.com/role: model-gateway
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true

terminationGracePeriodSeconds: 30
lifecycle: {}
# lifecycle:
#   preStop:
#     exec:
#       command: ["/bin/sh", "-c", "sleep 5"]

dnsPolicy: ClusterFirst
hostAliases: []
# hostAliases:
#   - ip: 192.168.1.22
#     hostnames: ["model-host.lab.local"]

nodeSelector: {}
# nodeSelector:
#   kubernetes.io/os: linux
tolerations: []
# tolerations:
#   - key: dedicated
#     operator: Equal
#     value: ai
#     effect: NoSchedule
affinity: {}
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: model-gateway
#           topologyKey: kubernetes.io/hostname
topologySpreadConstraints: []
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: model-gateway
priorityClassName: ""
# priorityClassName: system-cluster-critical  # Do not use for routine apps
runtimeClassName: ""
# runtimeClassName: nvidia
schedulerName: ""
# schedulerName: default-scheduler

# VOLUMES: Use standard Kubernetes Pod volumes, not PVC objects here.
volumes: []
# volumes:
#   # 1. Existing PVC shared by pods in ai-platform (RWX where needed)
