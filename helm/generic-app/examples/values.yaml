#       - name: common-data
#         mountPath: /shared
#   # Init-only PVC: put volume in 'volumes', mount ONLY here, not in volumeMounts.
#   - name: import-global-skills
#     image: busybox:1.36
#     command: ["sh", "-c"]
#     args: ["cp -R /source/. /dest/"]
#     volumeMounts:
#       - name: global-skills
#         mountPath: /source
#         readOnly: true
#       - name: scratch
#         mountPath: /dest

extraContainers: []
# extraContainers:
#   - name: otel-sidecar
#     image: otel/opentelemetry-collector:0.111.0
#     args: ["--config=/etc/otel/config.yaml"]
#     volumeMounts:
#       - name: otel-config
#         mountPath: /etc/otel
#         readOnly: true
#     resources:
#       requests:
#         cpu: 50m
