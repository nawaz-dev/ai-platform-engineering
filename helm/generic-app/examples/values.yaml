#   - name: api-certs
#     mountPath: /app/certs
#     readOnly: true

# Optional PVC objects created by THIS Helm release (requires pvc.yaml template).
# For shared PVCs used by many releases, create/manage once in an infra chart.
persistentVolumeClaims: []
# persistentVolumeClaims:
#   - name: rag-uploads-pvc
#     storageClassName: local-path  # Check 'kubectl get storageclass'
#     accessModes: [ReadWriteOnce]
#     volumeMode: Filesystem
#     size: 5Gi
#     annotations: {}
#     labels: {}
