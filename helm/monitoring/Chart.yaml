apiVersion: v2
name: monitoring
description: Prometheus and Grafana monitoring for vLLM
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: 0.1.0
    repository: file://charts/prometheus
    condition: prometheus.enabled

  - name: grafana
    version: 0.1.0
    repository: file://charts/grafana
    condition: grafana.enabled