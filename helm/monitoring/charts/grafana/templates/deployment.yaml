# Grafana Deployment manifest goes here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana
      release: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: grafana
        release: {{ .Release.Name }}

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3000"

            - name: GF_PATHS_DATA
              value: /var/lib/grafana

            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/log

            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins

            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning

            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: admin-password

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: grafana-data
              mountPath: /var/lib/grafana

      volumes:
        - name: datasource
          configMap:
            name: {{ .Release.Name }}-grafana-datasource

        - name: grafana-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-grafana-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}