# Prometheus ConfigMap manifest goes here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrape.interval }}

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ .Values.scrape.target | quote }}