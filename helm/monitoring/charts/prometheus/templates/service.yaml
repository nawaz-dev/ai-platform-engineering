# Prometheus Service manifest goes here.

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    app: prometheus

spec:
  type: ClusterIP

  selector:
    app: prometheus
    release: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP