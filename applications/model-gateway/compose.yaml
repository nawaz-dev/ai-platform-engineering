
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  model-gateway:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379
      RATE_LIMIT_RPM: "60"
    depends_on:
      redis:
        condition: service_healthy
